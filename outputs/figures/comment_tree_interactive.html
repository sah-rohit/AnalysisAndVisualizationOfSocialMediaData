<script>const comments = {"dftbll2": {"author": "[deleted]", "parent": "t3_63bxdl", "depth": 1, "body": "[deleted]"}, "dftchpw": {"author": "mattwarren", "parent": "t3_63bxdl", "depth": 1, "body": "There's also a bit more info in the related GitHub issue, see https://github.com/dotnet/coreclr/issues/10644"}, "dfteepk": {"author": "TheHillwoodMonkey", "parent": "t3_63bxdl", "depth": 1, "body": "The orginal Java proposal is [here](http://openjdk.java.net/jeps/8174901), and there's an article discussing it [here](https://www.infoq.com/news/2017/03/java-epsilon-gc). Though perhaps all you really need to see is this tweet from the author:\n\n&gt; Why don't we implement \"no\" GC in HotSpot, and win every single 5-second latency benchmark. 100 GB heap is enough to survive for 10 secs.\n\nI'm sure it was tongue-in-cheek.\n\nWhile googling for these things, I also stumbled across this [bizarre document](https://stlab.adobe.com/wiki/index.php/Argument_Against_GC) on adobe's website. Towards the bottom it begins to read like a holy text:\n\n&gt; Finally - address the \"C++ is bad because it has no GC\" argument head-on. C++ doesn't generate garbage and so has no need for GC.\n\nA truly blessed language would not consume cycles, and so would have no need for a CPU. Perhaps [HolyC](http://www.templeos.org/Wb/Doc/HolyC.html) holds the answers they seek."}, "dfu81dd": {"author": "TinynDP", "parent": "t3_63bxdl", "depth": 1, "body": "That didn't address anyone of the actually useful points. \n\nDebugging. If you can debug your application with \"--nogc\" you can rule out several reasons why you might have a problem. \n\n&gt;  GC.TryStartNoGCRegion \n\nYou have to edit your code to use that. If it were a switch to the runtime the code could be identical. These are serious apples-and-oranges. \n\n&gt; Would you rather have to spin up a whole new process just so that you can then do work that needs to do GCs\n\nSometimes, yes. Some jobs are so short that spinning up a nogc process is a reasonable option. \n\n"}, "dftocdc": {"author": "jackmott2", "parent": "t1_dfteepk", "depth": 2, "body": "&gt; A truly blessed language would not consume cycles\n\nc++ made entirely of well chosen intrinsics comes close!\n"}, "dftqm4h": {"author": "mirhagk", "parent": "t1_dfteepk", "depth": 2, "body": "They are obviously taking the point to the extreme, but there is a valid point in there. C++ does encourage a lot less heap allocations then C# or Java does. \n\nThere is some work being done in C# to reduce the need for allocations. Reference returns and locals help here, making it possible to use `struct` in more situations.\n\nMaking a near-zero allocation in C# should become much easier now. "}, "dfty0af": {"author": "tragicshark", "parent": "t1_dfteepk", "depth": 2, "body": "&gt; A truly blessed language would not consume cycles, and so would have no need for a CPU. Perhaps HolyC holds the answers they seek.\n\nOP has https://github.com/benaadams/System.Ben to help out with that in C#"}, "dftzv08": {"author": "cat_in_the_wall", "parent": "t1_dfteepk", "depth": 2, "body": "C++ generates garbage. The heap is garbage waiting to be reclaimed. C++ just requires it to be reclaimed manually rather than automatically. Both valid strategies, but to suggest that c++ never requires a process to reclaim memory does indeed sound like they are looking for a divine language."}, "dfu0h92": {"author": "TheHillwoodMonkey", "parent": "t1_dftzv08", "depth": 3, "body": "Or Forth, I suppose"}, "dfu5unv": {"author": "flukus", "parent": "t1_dftzv08", "depth": 3, "body": "I don't know if manually is the right word either, for most c++ code it should be reclaimed automatically when the container is removed from the stack."}, "dfubdhf": {"author": "oracleoftroy", "parent": "t1_dftzv08", "depth": 3, "body": "&gt; C++ just requires it to be reclaimed manually rather than automatically.\n\nIt is normal in C++ code to use RAII to automatically manage resources. For example, note which language requires manual resource management:\n\n    // C++\n    void foo() {\n        int i = 3; // no garbage\n        std::vector&lt;int&gt; ints(10); // heap allocation for array of 10 ints, no additional garbage (vector structure on stack)\n        std::fstream file(...); // resource allocation, automatically managed\n        ...\n    } // everything automatically cleaned up\n\n    // C#\n    void Foo() {\n        int i = 3; // no garbage\n        var ints = new List&lt;int&gt;(10); // heap allocation for List structure + array of 10 ints\n        var file = File.Open(...); // resource allocation, manually managed\n        ...\n    } // GC cleans up memory resources (eventually), but oops, forgot to manually \n      // clean up the file resource via Dispose() or using statements\n\nAt least the C# program will clean up the file if the finalizer ever runs, but that's not something you want to rely on, and in the meantime, the file may be locked or in an unexpected state when some other piece of code wants to access it."}, "dfu673i": {"author": "ummwut", "parent": "t1_dfu0h92", "depth": 4, "body": "Forth is pretty divine... if you construct it yourself from the ground-up maybe."}, "dfubvyo": {"author": "flukus", "parent": "t1_dfubdhf", "depth": 4, "body": "In c# you'd use a using statement for the file, which is essentially the same as RAII, but yes, it's more manual."}, "dfuep0i": {"author": "cat_in_the_wall", "parent": "t1_dfubdhf", "depth": 4, "body": "RAII is stack allocation. I was talking about heap allocation.\n\n&gt; The heap is garbage waiting to be reclaimed.\n\nVery few programs can get away without heap allocations. Very few only *create* objects and never need to reclaim them. If you have an object on the heap that is reclaimed, you have garbage. Whether you reclaim it manually (by way of properly managing smart pointers) or automatically (via gc), garbage is garbage, c++ doesn't save you from that. That's all I was saying."}, "dfuq6au": {"author": "cat_in_the_wall", "parent": "t1_dfu5unv", "depth": 4, "body": "you have to get your memory ownership correct. it is not manual in the sense of calling free, but, for instance, you have to deal with circles of dead objects. gc languages do that for you, c++ won't. by design, of course, and that's fine. structure your program better. but it is still manual memory management."}, "dfuf7sb": {"author": "cat_in_the_wall", "parent": "t1_dfubvyo", "depth": 5, "body": "Really wish there was a \"real\" way of doing raii in c#/java. c# using is the next best thing, you just have to remember to use it. Java's requires you to deal with an IOException on close. "}, "dfui667": {"author": "oracleoftroy", "parent": "t1_dfuep0i", "depth": 5, "body": "&gt; The heap is garbage waiting to be reclaimed.\n\nI agree with that. I was thinking of labeling every line that did heap allocation as garbage to highlight that, but I thought it might look like I was calling that line of code garbage and changed my mind.\n\nOne thing worth noting is that when my example function returns, the C++ version will have no remaining garbage, whereas the C# version (with the resource leak fixed) will leave some garbage on the street for the garbage collector to pick up later. It's a bit nitpicky, but it is a big part of the reason Adobe can with all seriousness say that C++ doesn't generate any garbage. I do prefer the more tempered version (which fits well with the point you are making) that says C++ generates less garbage than those languages that allocate nearly everything on the heap.\n\nI do have to disagree with the implication that not having to do anything special to clean up a resource is \"manual\" resource management, but having to remember to call Dispose() or use a using block is \"automatic\" resource management. Heap memory isn't the only type of garbage out there, even if it is the only one C# manages automatically.\n"}, "dfuqc24": {"author": "flukus", "parent": "t1_dfuq6au", "depth": 5, "body": "I forgot about that, it's not usually something I run into though on account of circular references usually being awful design."}, "dfuz0iu": {"author": "LPTK", "parent": "t1_dfubvyo", "depth": 5, "body": "Note that this is way more limited than RAII. In C++, I can make a _vector_ of files, and when I pop elements from it or when the whole vector goes away, the files are closed.\n\nSame thing for smart pointers, which allow to express resource ownership (which you can't do in C#)."}, "dfupv1d": {"author": "cat_in_the_wall", "parent": "t1_dfui667", "depth": 6, "body": "I never implied anything about external resources  (a la file handles or os mutexes) being garbage. Only heap stuff that needs to be reclaimed. That is garbage. And c++ (and every language) needs to reclaim heap memory. If it is deterministic (C++) or whenever (gc languages), it is still garbage. Memory needs to be managed by *some* strategy, manual or automatic, and suggesting that c++ produces no garbage is wrong if the program ever calls new, yes even in smart pointers.\n\nEDIT: and maybe c++ produces *less* garbage. written well, totally with you there. but \"no\" garbage is wrong. c++ is a language that can allocate things on the heap. so garbage happens."}, "dg2zzk8": {"author": "ilammy", "parent": "t1_dfuf7sb", "depth": 6, "body": "But you can't. Without duplicating the hierarchy of container classes and so on. Because RAII tries resource lifetime to object lifetime, and GC makes object lifetime indeterminate."}, "dg3gzrf": {"author": "cat_in_the_wall", "parent": "t1_dg2zzk8", "depth": 7, "body": "yep. you're gonna have a bad time trying to shoehorn something like that into a gc language."}};
const panel = document.getElementById('details');
document.querySelectorAll('g.node').forEach(node => {
  const title = node.querySelector(':scope > title');
  if (!title) return;
  const id = title.textContent.trim();
  title.remove();
  node.querySelectorAll('a').forEach(a => a.removeAttributeNS('http://www.w3.org/1999/xlink', 'title'));
  if (!comments[id]) return;
  node.style.cursor = 'pointer';
  node.onclick = () => {
    const c = comments[id];
    panel.innerHTML = '';
    const heading = document.createElement('h3'); heading.textContent = c.author;
    const meta = document.createElement('p'); meta.textContent = `ID: ${id} · Parent: ${c.parent} · Depth: ${c.depth}`;
    const body = document.createElement('div'); body.textContent = c.body || '(empty comment)';
    panel.append(heading, meta, body);
  };
});
</script></body></html>
